[project]
name = "learn-machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "scipy>=1.18.1",
  "torch==2.14.*",
]

[tool.ruff.lint]
# Disable fix for unused imports (`F401`).
unfixable = ["F401"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
